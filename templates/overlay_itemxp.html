<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Item XP Overlay</title>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      background: transparent;
      overflow: hidden;
    }

    #xpContainer {
      position: absolute;
      bottom: 100px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(20, 20, 20, 0.85);
      border: 2px solid #a79c65;
      border-radius: 12px;
      padding: 14px 24px;
      color: #ffffcc;
      font-family: 'Georgia', serif;
      font-size: 18px;
      text-align: center;
      box-shadow: 0 0 16px rgba(0, 0, 0, 0.7);
      display: none;
      z-index: 9999;
      min-width: 300px;
    }

    #xpIcon {
      width: 42px;
      height: 42px;
      vertical-align: middle;
      margin-right: 10px;
    }

    #xpBar {
      width: 100%;
      background: #222;
      border: 1px solid #666;
      border-radius: 6px;
      margin-top: 10px;
      height: 18px;
      overflow: hidden;
      box-shadow: inset 0 0 5px #000;
    }

    #xpFill {
      height: 100%;
      width: 0%;
      background: linear-gradient(to right, #ffff99, #ffcc33);
      transition: width 0.5s ease-in-out;
    }
  </style>
</head>
<body>
  <div id="xpContainer">
    <div>
      <img id="xpIcon" src="" alt="Item Icon" />
      <span id="xpItemName">Item Name</span>
    </div>
    <div id="xpBar">
      <div id="xpFill"></div>
    </div>
  </div>

  <script>
    const xpContainer = document.getElementById("xpContainer");
    const xpIcon = document.getElementById("xpIcon");
    const xpItemName = document.getElementById("xpItemName");
    const xpFill = document.getElementById("xpFill");

    let xpTimeout = null;

    function showXPOverlay(data) {
      xpIcon.src = data.icon;
      xpItemName.textContent = data.item;
      xpFill.style.width = `${Math.min(100, data.percent)}%`;

      xpContainer.style.display = "block";

      clearTimeout(xpTimeout);
      xpTimeout = setTimeout(() => {
        xpContainer.style.display = "none";
        xpFill.style.width = "0%";
      }, 5000);
    }

    function setupWebSocket() {
      const socket = new WebSocket("ws://localhost:6789");

      socket.onmessage = (event) => {
        const data = JSON.parse(event.data);
        if (data.type === "item_xp") {
          showXPOverlay(data);
        }
      };

      socket.onclose = () => {
        console.warn("WebSocket closed. Reconnecting...");
        setTimeout(setupWebSocket, 3000);
      };

      socket.onerror = (err) => {
        console.error("WebSocket error:", err);
        socket.close();
      };
    }

    setupWebSocket();
  </script>
</body>
</html>
